services:
  - type: web
    name: telegram-personal-manager
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: AUTO_REPLY
        value: "false"
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
